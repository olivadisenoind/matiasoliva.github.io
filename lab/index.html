nueva oportunidad material, funcional y expresiva.","credit":null,"images":["/fotos/md/capullo-01.jpg","/fotos/md/capullo-02.jpg","/fotos/md/capullo-03.jpg","/fotos/md/capullo-04.jpg","/fotos/md/capullo-05.jpg"]},{"id":"P02","slug":"cianoback","title":"Kit Cianoback","meta":"Sistema · 2024","text":"Sistema de bajo costo que adapta maquinaria de desagote existente para recolectar cianobacterias de manera más eficiente, con menor consumo energético y una mayor concentración del residuo, facilitando así su incorporación a nuevos ciclos productivos, como la generación de biogás.","credit":null,"images":["/fotos/md/cianoback-01.jpg","/fotos/md/cianoback-02.jpg","/fotos/md/cianoback-03.jpg","/fotos/md/cianoback-04.jpg","/fotos/md/cianoback-05.jpg","/fotos/md/cianoback-06.png"]},{"id":"P03","slug":"ordna","title":"Ordna","meta":"Sistema · 2026","text":"Sistema modular para la gestión de residuos urbanos que actúa como un facilitador relacional entre personas, basura, hogar y comunidad. Facilita la separación en origen, promueve hábitos responsables, recuerda horarios de recolección, favorece la integración de esquemas de clasificación según cada comunidad y de recolectores formales e informales en los circuitos de recolección urbana.","credit":null,"images":["/fotos/md/ordna-17.jpg","/fotos/md/ordna-graphic-02.jpg","/fotos/md/ordna-02.jpg","/fotos/md/ordna-03.jpg","/fotos/md/ordna-04.jpg","/fotos/md/ordna-05.jpg","/fotos/md/ordna-06.jpg","/fotos/md/ordna-07.jpg","/fotos/md/ordna-08.jpg","/fotos/md/ordna-09.jpg","/fotos/md/ordna-01.jpg","/fotos/md/ordna-detail-12.jpg"]}],"manifesto":[{"id":"MAN C01","title":"Manifiesto de diseño","meta":"Capítulo I","text":"No tengo la solución a la crisis ecológica, y desconfío de quien diga tenerla. Propongo algo más modesto: cinco maneras de proyectar en serio dentro de ella. No es un plan para salvar el mundo. Es lo suficiente para ponerse a trabajar.","images":[]},{"id":"MAN C02","title":"Dónde estamos parados","meta":"Capítulo II","text":"Este capítulo no explica cómo llegamos hasta acá. Describe qué encontramos al llegar.","images":[]},{"id":"MAN C03","title":"Los cinco enfoques","meta":"Capítulo III","text":"Cinco lentes, no cinco casilleros. Un proyecto puede mirarse desde varias a la vez, y algunos de los mejores se ven distintos según por cuál se los mire.","images":[]},{"id":"MAN C04","title":"Cómo se proyecta","meta":"Capítulo IV","text":"El Ecodiseño Radikal no propone una fórmula para idear. Hay teóricos de sobra que ya plantearon caminos, y todos sirven. Lo que sí propone es un orden de preguntas antes de llegar ahí.","images":[]},{"id":"MAN C05","title":"Caso · Ordna","meta":"Capítulo V","text":"Un manual sin un caso completo es una hipótesis. Este capítulo existe para que el método quede expuesto en un proyecto real, con lo que funcionó y con lo que todavía no.","images":[]}],"ui":{"brand":"ECODISEÑO RADIKAL","author":"Matías Oliva · Diseñador","authorLabel":"Autor / diseñador","jobTitle":"Diseñador industrial","skip":"Saltar al contenido","index":"ÍNDICE","close":"Cerrar","menu":"Abrir índice","language":"Idioma","languageMenu":"Seleccionar idioma","currentSection":"Sección actual","progress":"Progreso de lectura","socialNavigation":"Redes sociales","home":"Inicio","criticalDesignArchive":"ARCHIVO DE DISEÑO CRÍTICO","scroll":"RECORRIDO","firstScroll":"PRIMER RECORRIDO","archive":"ARCHIVO","position":"POSICIÓN","contact":"CONTACTO","evidence":"EVIDENCIA","read":"LEER","viewEdition":"VER EDICIÓN","download":"DESCARGAR PDF","readNote":"Botón “Leer” para acceder al manifiesto traducido.","projectArchive":"Archivo de proyectos","openProject":"Abrir expediente","backToArchive":"Volver al archivo","previous":"Anterior","next":"Siguiente","image":"Imagen","images":"Imágenes","openImage":"Ampliar imagen","closeViewer":"Cerrar visor","zoomIn":"Acercar","zoomOut":"Alejar","resetZoom":"Restablecer zoom","fullscreen":"Pantalla completa","credits":"Créditos","collaboration":"Colaboración","projec  como a geração de biogás.","credit":null,"images":["/fotos/md/cianoback-01.jpg","/fotos/md/cianoback-02.jpg","/fotos/md/cianoback-03.jpg","/fotos/md/cianoback-04.jpg","/fotos/md/cianoback-05.jpg","/fotos/md/cianoback-06.png"]},{"id":"P03","slug":"ordna","title":"Ordna","meta":"Sistema · 2026","text":"Sistema modular para a gestão de resíduos urbanos que atua como facilitador relacional entre pessoas, lixo, lar e comunidade. Facilita a separação na origem, promove hábitos responsáveis, lembra horários de coleta, favorece a integração de esquemas de classificação segundo cada comunidade e de catadores formais e informais nos circuitos de coleta urbana.","credit":null,"images":["/fotos/md/ordna-17.jpg","/fotos/md/ordna-graphic-02.jpg","/fotos/md/ordna-02.jpg","/fotos/md/ordna-03.jpg","/fotos/md/ordna-04.jpg","/fotos/md/ordna-05.jpg","/fotos/md/ordna-06.jpg","/fotos/md/ordna-07.jpg","/fotos/md/ordna-08.jpg","/fotos/md/ordna-09.jpg","/fotos/md/ordna-01.jpg","/fotos/md/ordna-detail-12.jpg"]}],"manifesto":[{"id":"MAN C01","title":"Manifesto de design","meta":"Capítulo I","text":"Não tenho a solução para a crise ecológica, e desconfio de quem diga tê-la. Proponho algo mais modesto: cinco maneiras de projetar a sério dentro dela. Não é um plano para salvar o mundo. É o suficiente para começar a trabalhar.","images":[]},{"id":"MAN C02","title":"Onde estamos pisando","meta":"Capítulo II","text":"Este capítulo não explica como chegamos até aqui. Descreve o que encontramos ao chegar.","images":[]},{"id":"MAN C03","title":"As cinco abordagens","meta":"Capítulo III","text":"Cinco lentes, não cinco gavetas. Um projeto pode ser olhado por várias ao mesmo tempo, e alguns dos melhores mudam de aparência conforme a lente.","images":[]},{"id":"MAN C04","title":"Como se projeta","meta":"Capítulo IV","text":"O Ecodesign Radikal não propõe uma fórmula para idear. Há teóricos de sobra que já apontaram caminhos, e todos servem. O que ele propõe é uma ordem de perguntas antes de chegar lá.","images":[]},{"id":"MAN C05","title":"Caso · Ordna","meta":"Capítulo V","text":"Um manual sem um caso completo é uma hipótese. Este capítulo existe para que o método fique exposto num projeto real, com o que funcionou e com o que ainda não.","images":[]}],"ui":{"brand":"ECODISEÑO RADIKAL","author":"Matías Oliva · Designer","authorLabel":"Autor / designer","jobTitle":"Designer industrial","skip":"Pular para o conteúdo","index":"ÍNDICE","close":"Fechar","menu":"Abrir índice","language":"Idioma","languageMenu":"Selecionar idioma","currentSection":"Seção atual","progress":"Progresso de leitura","socialNavigation":"Redes sociais","home":"Início","criticalDesignArchive":"ARQUIVO DE DESIGN CRÍTICO","scroll":"PERCURSO","firstScroll":"PRIMEIRO PERCURSO","archive":"ARQUIVO","position":"POSIÇÃO","contact":"CONTATO","evidence":"EVIDÊNCIA","read":"LER","viewEdition":"VER EDIÇÃO","download":"BAIXAR PDF","readNote":"Botão “Ler” para acessar o manifesto traduzido.","projectArchive":"Arquivo de projetos","openProject":"Abrir expediente","backToArchive":"Voltar ao arquivo","previous":"Anterior","next":"Próximo","image":"Imagem","images":"Imagens","openImage":"Ampliar imagem","closeViewer":"Fechar visualizador","zoomIn":"Aproximar","zoomOut":"Afastar","resetZoom":"Redefinir zoom","fullscreen":"Tela inteira","credits":"Créditos","collaboration":"Colaboração","project":"Projeto","inDevelopment":"Em desenvolvimento","chapters":"Capítulos","chapter":"Capítulo","edition":"Edição","page":"Página","pages":"Páginas","singlePage":"Página simples","spread":"Página dupla","lab":"Content Lab","source":"Fonte","content":"Conteúdo","format":"Formato","type":"Tipo","variation":"Variação","manualText":"Texto manual","enterText":"Escreva o texto a compor","manifesto":"Manifesto","exportPng":"Exportar PNG","exportJpg":"Exportar JPG","generate":"Gerar","statement":"Declaração","imageText":"Imagem + texto","quote":"Citação","technicalArchive":"Arquivo técnico","preview":"Pré-visualização","directAccess":"Ferramenta editorial","copy":"Copiar","copied":"Copiado","linkedin":"LINKEDIN","behance":"BEHANCE","footerCopyright":"© 2026 MATÍAS OLIVA","footerMotto":"DISEÑO COMO ACTO CULTURAL","footerLocation":"CÓRDOBA · AR","pendingMaster":"MASTER VETORIAL PENDENTE","provisionalSymbol":"SÍMBOLO PROVISÓRIO · MASTER VETORIAL PENDENTE","labPreviewLabel":"Pré-visualização do Radikal Content Lab","notFound":"Página não encontrada","notFoundText":"O expediente solicitado não existe ou mudou de localização.","returnHome":"Voltar ao início"},"homePath":"/pt/"},"en":{"projects":[{"id":"P01","slug":"capullo","title":"Cocoon Armchair","meta":"Object · 2025","text":"Experimental furniture design developed from the reuse of textile waste. Its enveloping silhouette proposes a distinctive experience and transforms these discards into a new material, functional, and expressive opportunity.","credit":null,"images":["/fotos/md/capullo-01.jpg","/fotos/md/capullo-02.jpg","/fotos/md/capullo-03.jpg","/fotos/md/capullo-04.jpg","/fotos/md/capullo-05.jpg"]},{"id":"P02","slug":"cianoback","title":"Cianoback Kit","meta":"System · 2024","text":"A low-cost system that adapts existing drainage machinery to collect cyanobacteria with greater efficiency, lower energy consumption, and higher residue concentration — enabling its incorporation into new productive cycles, such as biogas generation.","credit":null,"images":["/fotos/md/cianoback-01.jpg","/fotos/md/cianoback-02.jpg","/fotos/md/cianoback-03.jpg","/fotos/md/cianoback-04.jpg","/fotos/md/cianoback-05.jpg","/fotos/md/cianoback-06.png"]},{"id":"P03","slug":"ordna","title":"Ordna","meta":"System · 2026","text":"A modular system for urban waste management that acts as a relational enabler among people, waste, home, and community. It supports source separation, fosters responsible habits, reminds of collection schedules, and helps integrate community-specific sorting schemes and both formal and informal collectors into urban collection circuits.","credit":null,"images":["/fotos/md/ordna-17.jpg","/fotos/md/ordna-graphic-02.jpg","/fotos/md/ordna-02.jpg","/fotos/md/ordna-03.jpg","/fotos/md/ordna-04.jpg","/fotos/md/ordna-05.jpg","/fotos/md/ordna-06.jpg","/fotos/md/ordna-07.jpg","/fotos/md/ordna-08.jpg","/fotos/md/ordna-09.jpg","/fotos/md/ordna-01.jpg","/fotos/md/ordna-detail-12.jpg"]}],"manifesto":[{"id":"MAN C01","title":"Design manifesto","meta":"Chapter I","text":"I don't have the solution to the ecological crisis, and I distrust anyone who claims to. I propose something more modest: five ways to design seriously within it. It is not a plan to save the world. It is enough to get to work.","images":[]},{"id":"MAN C02","title":"Where we are standing","meta":"Chapter II","text":"This chapter does not explain how we got here. It describes what we found on arrival.","images":[]},{"id":"MAN C03","title":"The five approaches","meta":"Chapter III","text":"Five lenses, not five boxes. A project can be looked at through several at once, and some of the best ones look different depending on which one you pick up.","images":[]},{"id":"MAN C04","title":"How it is designed","meta":"Chapter IV","text":"Radikal Ecodesign does not propose a formula for ideation. There are more than enough theorists who have already laid out paths, and all of them work. What it does propose is an order of questions to ask before getting there.","images":[]},{"id":"MAN C05","title":"Case · Ordna","meta":"Chapter V","text":"A manual without a complete case is a hypothesis. This chapter exists so the method is exposed in a real project, with what worked and with what does not work yet.","images":[]}],"ui":{"brand":"ECODISEÑO RADIKAL","author":"Matías Oliva · Designer","authorLabel":"Author / designer","jobTitle":"Industrial designer","skip":"Skip to content","index":"INDEX","close":"Close","menu":"Open index","language":"Language","languageMenu":"Select language","currentSection":"Current section","progress":"Reading progress","socialNavigation":"Social l
